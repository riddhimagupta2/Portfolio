<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140405"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2E3B"/>
      <stop offset="100%" stop-color="#E50914"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#E50914" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Rounded App Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#E50914" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Iconic 'R' Logo Mark -->
  <g filter="url(#glow)">
    <!-- Vertical Spine -->
    <rect x="16" y="13" width="7.5" height="38" rx="1.5" fill="url(#redGrad)"/>
    <!-- Top Loop -->
    <path d="M 23.5 13 L 34.5 13 C 41 13 45.5 16.5 45.5 23 C 45.5 29.5 41 33 34.5 33 L 23.5 33 Z" fill="url(#redGrad)"/>
    <path d="M 23.5 19.5 L 33.5 19.5 C 36.5 19.5 38.5 20.8 38.5 23 C 38.5 25.2 36.5 26.5 33.5 26.5 L 23.5 26.5 Z" fill="#0c0405"/>
    <!-- Diagonal Leg -->
    <path d="M 30.5 31.5 L 44 51 L 35 51 L 23.5 34 Z" fill="url(#redGrad)"/>
  </g>

  <!-- Accent Red Dot -->
  <circle cx="49" cy="49" r="2.5" fill="#FFFFFF"/>
</svg>