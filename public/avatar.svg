<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="neonRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#E50914" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#bgGrad)" rx="24"/>
  <rect width="396" height="496" x="2" y="2" fill="none" stroke="#E50914" stroke-opacity="0.3" stroke-width="2" rx="22"/>

  <!-- Cyber Grid Lines -->
  <path d="M 0 100 L 400 100 M 0 200 L 400 200 M 0 300 L 400 300 M 0 400 L 400 400" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 100 0 L 100 500 M 200 0 L 200 500 M 300 0 L 300 500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Silhouette Icon -->
  <g transform="translate(100, 110)" filter="url(#redGlow)">
    <!-- Head -->
    <circle cx="100" cy="70" r="50" fill="url(#neonRed)"/>
    <!-- Body -->
    <path d="M 20 220 C 20 160, 60 145, 100 145 C 140 145, 180 160, 180 220 Z" fill="url(#neonRed)"/>
    <!-- Cyber Visor -->
    <path d="M 70 65 L 130 65" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Cyber Badge -->
  <rect x="110" y="380" width="180" height="34" rx="8" fill="#1b0809" stroke="#E50914" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="200" y="402" fill="#E50914" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">DEVELOPER AVATAR</text>
</svg>
